<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100">
<rect width="100%" height="100%" fill="white"/>
<text x="600" y="40" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#111">CaseTrack: protected timeline save</text>
<rect x="30" y="90" width="1140" height="90" rx="4" fill="#f6f6f6" stroke="#222" stroke-width="2" stroke-dasharray="9 6"/>
<text x="600.0" y="127.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" fill="#111">Outside CaseTrack: external authority decides the extension.</text>
<text x="600.0" y="159.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" fill="#111">Investigator / Supervisor receives the decision and supporting reference.</text>
<rect x="310" y="220" width="580" height="85" rx="4" fill="#f6f6f6" stroke="#222" stroke-width="2"/>
<text x="600.0" y="270.5" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" fill="#111">Open authorized timeline; retain case version</text>
<polyline points="600,180 600,220" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="9 6"/>
<polygon points="600,220 594.345448056554,208.2941876694152 605.654551943446,208.2941876694152" fill="#222"/>
<rect x="310" y="350" width="580" height="100" rx="4" fill="#f6f6f6" stroke="#222" stroke-width="2"/>
<text x="600.0" y="392.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" fill="#111">Enter dates, explicit grant state and note;</text>
<text x="600.0" y="424.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" fill="#111">Supervisor also gives an edit reason</text>
<polyline points="600,305 600,350" fill="none" stroke="#222" stroke-width="2"/>
<polygon points="600,350 594.345448056554,338.2941876694152 605.654551943446,338.2941876694152" fill="#222"/>
<rect x="310" y="495" width="580" height="100" rx="4" fill="#f6f6f6" stroke="#222" stroke-width="2"/>
<text x="600.0" y="537.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" fill="#111">Submit: lock and reload parent case;</text>
<text x="600.0" y="569.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" fill="#111">recheck permission and version</text>
<polyline points="600,450 600,495" fill="none" stroke="#222" stroke-width="2"/>
<polygon points="600,495 594.345448056554,483.2941876694152 605.654551943446,483.2941876694152" fill="#222"/>
<rect x="30" y="635" width="280" height="100" rx="4" fill="#f6f6f6" stroke="#222" stroke-width="2"/>
<text x="170.0" y="677.36" text-anchor="middle" font-family="Arial" font-size="23" font-weight="normal" fill="#111">Stale / unauthorized /</text>
<text x="170.0" y="707.36" text-anchor="middle" font-family="Arial" font-size="23" font-weight="normal" fill="#111">invalid: reject save</text>
<polyline points="310,545 170,545 170,635" fill="none" stroke="#222" stroke-width="2"/>
<polygon points="170,635 164.345448056554,623.2941876694152 175.654551943446,623.2941876694152" fill="#222"/>
<text x="160" y="520" text-anchor="middle" font-family="Arial" font-size="22" font-weight="normal" fill="#111">Check fails</text>
<rect x="410" y="635" width="690" height="120" rx="4" fill="#f6f6f6" stroke="#222" stroke-width="2"/>
<text x="755.0" y="671.68" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" fill="#111">Valid confirmed torture grant: calculate docket +90.</text>
<text x="755.0" y="702.68" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" fill="#111">Without grant: stored base, otherwise docket +60.</text>
<text x="755.0" y="733.68" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" fill="#111">Unknown / No: no 60-day evaluation.</text>
<polyline points="700,595 700,635" fill="none" stroke="#222" stroke-width="2"/>
<polygon points="700,635 694.345448056554,623.2941876694152 705.654551943446,623.2941876694152" fill="#222"/>
<text x="870" y="620" text-anchor="middle" font-family="Arial" font-size="22" font-weight="normal" fill="#111">Checks pass</text>
<rect x="410" y="800" width="690" height="100" rx="4" fill="#f6f6f6" stroke="#222" stroke-width="2"/>
<text x="755.0" y="842.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" fill="#111">Commit timeline, one version increment and audits</text>
<text x="755.0" y="874.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" fill="#111">in one transaction; any failure rolls back</text>
<polyline points="755,755 755,800" fill="none" stroke="#222" stroke-width="2"/>
<polygon points="755,800 749.345448056554,788.2941876694152 760.654551943446,788.2941876694152" fill="#222"/>
<rect x="410" y="945" width="690" height="80" rx="4" fill="#f6f6f6" stroke="#222" stroke-width="2"/>
<text x="755.0" y="993.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="normal" fill="#111">Show effective deadline and case-specific history</text>
<polyline points="755,900 755,945" fill="none" stroke="#222" stroke-width="2"/>
<polygon points="755,945 749.345448056554,933.2941876694152 760.654551943446,933.2941876694152" fill="#222"/>
<text x="600" y="1080" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" fill="#111">90-day formula is a prototype assumption requiring CHR validation.</text>
</svg>