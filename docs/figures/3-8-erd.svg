<text x="415" y="307" text-anchor="start" font-family="Arial" font-size="22" font-weight="normal" fill="#111">FK approved_by (nullable)</text>
<text x="415" y="337" text-anchor="start" font-family="Arial" font-size="22" font-weight="normal" fill="#111">approved_at; remember_token</text>
<text x="415" y="367" text-anchor="start" font-family="Arial" font-size="22" font-weight="normal" fill="#111">timestamps</text>
