<polyline points="700,815 700,940" fill="none" stroke="#222" stroke-width="2"/>
<text x="920" y="880" text-anchor="middle" font-family="Arial" font-size="22" font-weight="normal" fill="#111">1 : 1; legacy timeline may be absent</text>
<text x="875" y="1435" text-anchor="middle" font-family="Arial" font-size="23" font-weight="normal" fill="#111">No extension-approval table or approval role.</text>
<text x="875" y="1465" text-anchor="middle" font-family="Arial" font-size="23" font-weight="normal" fill="#111">Grant notes identify the external decision.</text>
<text x="875" y="1495" text-anchor="middle" font-family="Arial" font-size="23" font-weight="normal" fill="#111">Only confirmed torture cases receive 60-day evaluation.</text>
