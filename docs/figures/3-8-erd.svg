<text x="915" y="247" text-anchor="start" font-family="Arial" font-size="22" font-weight="normal" fill="#111">FK case_id (nullable)</text>
<text x="915" y="277" text-anchor="start" font-family="Arial" font-size="22" font-weight="normal" fill="#111">action_performed; timestamp</text>
<text x="915" y="307" text-anchor="start" font-family="Arial" font-size="22" font-weight="normal" fill="#111">notes (nullable text)</text>
<text x="915" y="337" text-anchor="start" font-family="Arial" font-size="22" font-weight="normal" fill="#111">Extension events: old/new date</text>
<text x="915" y="367" text-anchor="start" font-family="Arial" font-size="22" font-weight="normal" fill="#111">and reference in notes</text>
