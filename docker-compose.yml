services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.4
    environment:
      # DB_USERNAME is root (matches the host XAMPP convention), so only
      # MYSQL_ROOT_PASSWORD is set — MYSQL_USER=root alongside it is rejected
      # by the image ("use MYSQL_ROOT_PASSWORD instead").
      MYSQL_DATABASE: ${DB_DATABASE:-casetrack}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - casetrack-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  casetrack-db:
  node_modules:
