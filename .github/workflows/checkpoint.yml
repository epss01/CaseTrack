name: Checkpoint contents

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 .github/scripts/test_checkpoint.py
      - name: Inspect paths in the candidate Git tree
        run: python3 .github/scripts/check-checkpoint.py
